name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  TEST_DB_URL: mongodb://localhost:27022/clearance_service
  ACS_SYSTEM: ccure
  CCURE_USERNAME: test-username
  CCURE_PASSWORD: test-password
  CCURE_BASE_URL: http://localhost:9999
  CCURE_CLIENT_NAME: test-client-name
  CCURE_CLIENT_VERSION: "2.9"
  CCURE_CLIENT_ID: test-client-id

jobs:
  run-tests:
    name: "Run Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Mongo
        shell: bash
        env:
          TAG: "4.4.18"
          PORT: "27022"
        run: |
          echo "TAG: ${TAG}"
          echo "PORT: ${PORT}"
          running_containers="$(docker ps -a -f status=running -q)"
          if [ -n "${running_containers}" ]; then
            sudo docker stop ${running_containers}
          fi
          sudo docker run -d -p "${PORT}:27017" "mongo:${TAG}"
      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Cache Packages
        uses: actions/cache@v3
        with:
          path: ~/.local
          key: requirements-local-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('**/requirements/base/base.txt') }}-${{ hashFiles('**/requirements/dev/dev.txt') }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            requirements-local-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-
      - name: Setup Virtual Environment
        run: |
          python -m venv venv
      - run: |
          source venv/bin/activate
          make setup
      - name: Run Tests
        run: |
          source venv/bin/activate
          pytest
      - name: End the Job if the Tests Fail
        if: ${{ failure() }}
        run: exit 1

  build-and-push:
    name: "Build & Push"
    needs: run-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Compute image tag
        id: vars
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TIMESTAMP=$(date -u +'%Y-%m-%d.%H%MZ')
          echo "tag=${GITHUB_REF_NAME}.${SHORT_SHA}.${TIMESTAMP}" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/clearance-service"
          IMAGE_TAG="${IMAGE_BASE}:${{ steps.vars.outputs.tag }}"
          docker build . -t "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            IMAGE_LATEST="${IMAGE_BASE}:latest"
            docker tag "$IMAGE_TAG" "$IMAGE_LATEST"
            docker push "$IMAGE_LATEST"
          fi
