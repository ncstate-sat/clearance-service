name: Deploy Docs

on:
  push:
    branches:
      - publishing

jobs:
  deploy-docs:
    name: "Deploy Docs"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.5.3, <10.0.0"

      # mkdocs gh-deploy commits the built site to the gh-pages branch; git refuses
      # to commit without an identity, so we set one for the runner here.
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
